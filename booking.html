<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Mitesh Dental Care</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563EB', primaryLight: '#eff6ff', dark: '#1f2937' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 antialiased min-h-screen flex flex-col">

    <!-- Simple Navigation -->
    <nav class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center font-bold">M</div>
                <span class="text-primary font-bold text-xl tracking-tight">Mitesh Dental</span>
            </div>
            <a href="index.html" class="text-gray-500 hover:text-primary font-medium flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <!-- Booking Form Section -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6">
        <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 sm:p-12 border border-gray-100">
            
            <div class="text-center mb-10">
                <h1 class="text-3xl sm:text-4xl font-bold text-dark mb-3">Request an Appointment</h1>
                <p class="text-gray-500">Fill out the details below. Our front desk will contact you to confirm your exact time.</p>
            </div>

            <!-- THE FORM (Connected to your email) -->
            <form action="https://formsubmit.co/mokshadbunde270407@gmail.com" method="POST" class="space-y-6">
                
                <!-- Disable Captcha for a smoother user experience -->
                <input type="hidden" name="_captcha" value="false">
                <!-- Subject line for the email you receive -->
                <input type="hidden" name="_subject" value="New Appointment Request - Mitesh Dental">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name <span class="text-red-500">*</span></label>
                        <input type="text" name="Name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primaryLight outline-none transition-all" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number <span class="text-red-500">*</span></label>
                        <input type="tel" name="Phone" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primaryLight outline-none transition-all" placeholder="+91 00000 00000">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address <span class="text-red-500">*</span></label>
                        <input type="email" name="Email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primaryLight outline-none transition-all" placeholder="you@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Preferred Date <span class="text-red-500">*</span></label>
                        <input type="date" name="Date" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primaryLight outline-none text-gray-600">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Service Needed</label>
                    <select name="Service" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primaryLight outline-none text-gray-600 bg-white">
                        <option value="General Checkup">General Checkup</option>
                        <option value="Teeth Whitening">Teeth Whitening</option>
                        <option value="Implants or Crowns">Implants or Crowns</option>
                        <option value="Tooth Pain / Emergency">Tooth Pain / Emergency</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Additional Message (Optional)</label>
                    <textarea name="Message" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primaryLight outline-none transition-all" placeholder="Any specific issues or questions?"></textarea>
                </div>

                <button type="submit" class="w-full bg-primary text-white font-bold text-lg py-4 rounded-xl hover:bg-blue-700 transition-all shadow-md hover:shadow-lg mt-4">
                    Submit Request
                </button>
            </form>

        </div>
    </main>

</body>
</html>
